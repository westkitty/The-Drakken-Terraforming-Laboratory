name: Validate laboratory

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --legacy-peer-deps --ignore-scripts; fi
      - name: Promote generated lockfile on this PR branch
        if: github.event_name == 'pull_request'
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock dependencies for reproducible builds"
          git push origin HEAD:"${GITHUB_HEAD_REF}"
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Static safeguards
        run: |
          ! grep -R "Math.random()" src
          ! grep -R -E "fetch\\(|XMLHttpRequest|WebSocket|https?://" src
          ! grep -R -i "blood ring.*halo\|halo.*blood ring" src docs README.md 2>/dev/null
          git diff --check
