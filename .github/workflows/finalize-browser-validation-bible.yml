name: Finalize browser validation Bible

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ENTRY_B64: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Append final browser-validation Bible entry
        run: |
          if ! grep -q '^### Entry 11 - Real Chrome first-look and runtime validation$' The_Drakken_Terraforming_Laboratory_Bible.md; then
            printf '%s' "$ENTRY_B64" | base64 -d >> The_Drakken_Terraforming_Laboratory_Bible.md
          fi
          rm -f .github/workflows/finalize-browser-validation-bible.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add The_Drakken_Terraforming_Laboratory_Bible.md .github/workflows/finalize-browser-validation-bible.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Append browser-validation project bible handoff [skip ci]"
          git push origin HEAD:main
