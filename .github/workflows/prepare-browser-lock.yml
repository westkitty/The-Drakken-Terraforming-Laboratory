name: Prepare browser validation lock

on:
  push:
    branches: [browser-validation-20260819]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: browser-validation-20260819
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Regenerate lockfile for pinned dev dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock Playwright browser validation dependency"
          git push origin HEAD:browser-validation-20260819
